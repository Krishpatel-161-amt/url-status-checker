[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "URL-status-checker"
version = "1.0"

description = "A command-line tool that checks whether website URLs are healthy."

license = "MIT"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "requests>=2.34.2",
    "PyYAML>=6.0.3"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
url-status-checker = "url_status_checker.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]